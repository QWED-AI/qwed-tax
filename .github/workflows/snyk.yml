# Snyk Security Scan for QWED-Tax
# Scans Python dependencies and source code (SAST)
# Secrets required: SNYK_TOKEN, SNYK_ORG_ID

name: Snyk Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly scan every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  snyk-python:
    name: Snyk Python Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check Snyk credentials
        id: credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        run: |
          if [ -n "$SNYK_TOKEN" ] && [ -n "$SNYK_ORG_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        if: steps.credentials.outputs.available == 'true'
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        if: steps.credentials.outputs.available == 'true'
        with:
          python-version: '3.11'

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1303.2
        if: steps.credentials.outputs.available == 'true'

      - name: Install Python dependencies
        if: steps.credentials.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . || true

      - name: Generate requirements for Snyk
        if: steps.credentials.outputs.available == 'true'
        run: pip freeze > requirements.txt

      - name: Snyk Python dependency scan
        if: steps.credentials.outputs.available == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --org=${{ secrets.SNYK_ORG_ID }} --severity-threshold=high --sarif-file-output=snyk-python.sarif

      - name: Upload Snyk Python results to GitHub Security
        uses: github/codeql-action/upload-sarif@b14c7811d99f9972fdf29f4247b2cde20f3df329 # v4.35.0
        if: always() && hashFiles('snyk-python.sarif') != ''
        with:
          sarif_file: snyk-python.sarif

  snyk-code:
    name: Snyk Code SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check Snyk credentials
        id: credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        run: |
          if [ -n "$SNYK_TOKEN" ] && [ -n "$SNYK_ORG_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        if: steps.credentials.outputs.available == 'true'
        with:
          persist-credentials: false

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1303.2
        if: steps.credentials.outputs.available == 'true'

      - name: Snyk Code analysis
        if: steps.credentials.outputs.available == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --org=${{ secrets.SNYK_ORG_ID }} --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code results
        uses: github/codeql-action/upload-sarif@b14c7811d99f9972fdf29f4247b2cde20f3df329 # v4.35.0
        if: always() && hashFiles('snyk-code.sarif') != ''
        with:
          sarif_file: snyk-code.sarif
